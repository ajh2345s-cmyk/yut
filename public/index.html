<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#204d41"><title>윷놀이</title><link rel="stylesheet" href="/style.css"></head><body>
<section id="entry"><div class="login"><h1>윷놀이</h1><div class="tabs"><button id="studentTab" class="selected" type="button">학생</button><button id="teacherTab" type="button">선생님</button></div><form id="entryForm"><label id="codeLabel">교실 번호<input id="roomCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"></label><p id="qrRoom" hidden></p><label id="nameLabel">내 이름 · 6글자 이내<input id="nickname" maxlength="6" autocomplete="off" required></label><label id="passwordLabel" hidden>관리자 코드<input id="password" type="password" autocomplete="current-password"></label><p id="entryHelp" class="muted"></p><button class="primary" id="enterButton">입장</button></form><p id="restoreStatus" class="muted" role="status"></p></div></section>
<main id="app" hidden><header><strong>윷놀이</strong><span id="roomNumber"></span><div class="top-actions"><button id="qrButton" hidden>QR</button><button id="adminButton" hidden>관리</button><button id="roomsButton">방 이동</button><button id="bracketButton">대진표</button></div></header><div id="banner" role="status"></div>
<section id="stage"><div class="match-heading"><h2 id="matchTitle"></h2><button id="myGame" hidden>내 경기</button></div><div id="playersBar"></div><div id="boardSlot"><div id="board"></div><div id="empty"><h2 id="emptyTitle">친구들을 기다려요</h2><div id="emptyContent"></div></div></div><section id="playDock"><div class="turn-row"><strong id="turnMessage" role="status"></strong><span id="clock"></span></div><div id="results"></div><div id="controls"></div><div id="lastEvent"></div></section></section>
<nav class="bottom-nav"><span id="myIdentity"></span><button id="logButton">기록</button><button id="switchUser">이름 변경</button></nav></main>
<dialog id="roomsDialog"><div class="dialog-head"><h2>경기장 이동</h2><button data-close="roomsDialog" aria-label="닫기">✕</button></div><div id="roomsList" class="scroll-list"></div></dialog>
<dialog id="bracketDialog"><div class="dialog-head"><h2 id="bracketTitle">대진표</h2><button data-close="bracketDialog" aria-label="닫기">✕</button></div><div id="bracketContent" class="scroll-list"></div><div id="bracketActions" class="dialog-actions"></div></dialog>
<dialog id="adminDialog"><div class="dialog-head"><h2>선생님 관리</h2><button data-close="adminDialog" aria-label="닫기">✕</button></div><div class="scroll-list"><div id="modePicker" class="tabs"></div><p id="modeHelp" class="muted"></p><div id="teacherActions" class="actions"></div><form id="settingsForm"><h3>진행 시간</h3><div class="settings-row"><label>윷 던지기(초)<input type="number" id="throwSeconds" min="0" max="180" step="1"></label><label>말 이동(초)<input type="number" id="moveSeconds" min="0" max="180" step="1"></label></div><p class="muted">0은 무제한 · 5~180초 · 시간 종료 시 자동 진행<br>끊기거나 화면을 나가면 해당 경기 시간 정지</p><button type="submit" class="primary">시간 적용</button></form><section id="matchAdmin"></section><h3>참가자</h3><div id="roster"></div><div id="recovery"></div></div></dialog>
<dialog id="qrDialog"><div class="dialog-head"><h2>QR로 입장</h2><button data-close="qrDialog" aria-label="닫기">✕</button></div><img id="qrImage" alt="교실 참가 QR 코드"><strong id="qrCode"></strong><p>카메라로 비추고 이름을 입력하세요.</p><button id="copyLink" class="primary">참가 링크 복사</button></dialog>
<dialog id="choiceDialog"><div class="dialog-head"><h2>어떤 결과로 갈까요?</h2><button data-close="choiceDialog" aria-label="닫기">✕</button></div><div id="moveChoices" class="actions"></div></dialog>
<dialog id="logDialog"><div class="dialog-head"><h2>경기 기록</h2><button data-close="logDialog" aria-label="닫기">✕</button></div><ol id="gameLog"></ol></dialog>
<dialog id="manualDialog"><div class="dialog-head"><h2>자유 매치 지정</h2><button data-close="manualDialog" aria-label="닫기">✕</button></div><p class="muted">원하는 학생들만 짝지어 주세요. 선택하지 않은 학생은 관전해요.</p><div id="pairRows" class="scroll-list"></div><p id="pairSummary" class="muted"></p><div class="dialog-actions"><button id="addPair">경기 추가</button><button id="confirmPairs" class="primary">매치 확정</button></div></dialog>
<div id="throwOverlay" hidden aria-live="polite" role="status"><div class="throw-card"><p id="throwPlayer"></p><div id="bigSticks" class="big-sticks" aria-hidden="true"></div><strong id="throwResult"></strong><span id="throwDetail"></span></div></div>
<div id="toast" role="alert" hidden></div><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
